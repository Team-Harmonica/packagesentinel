[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "packagesentinel"
version = "0.1.0"
description = "PackageSentinel backend and static package analysis tools"
readme = "packagesentinel/README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.30.0",
    "pydantic>=2.7.0",
    "pydantic-settings>=2.2.0",
    "sqlalchemy[asyncio]>=2.0.30",
    "greenlet>=3.0.0",
    "aiosqlite>=0.20.0",
]

[project.optional-dependencies]
test = [
    "httpx>=0.27.0",
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
]

[project.scripts]
packagesentinel = "app.cli:main"

[tool.setuptools]
package-dir = {"" = "packagesentinel"}

[tool.setuptools.packages.find]
where = ["packagesentinel"]
include = ["app*"]
