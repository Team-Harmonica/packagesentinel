[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "harmonica"
version = "0.1.0"
description = "PkgSentinel: static, explainable malware scanner for npm and PyPI packages"
readme = "README.md"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
harmonica = "harmonica.cli:main"

[tool.setuptools]
packages = ["harmonica"]
